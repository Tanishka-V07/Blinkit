
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">

        <div class="logo">
            blinkit
        </div>

        <div class="location">
            <h3>Delivery in 17 minutes</h3>
            <p>Meerut, Uttar Pradesh, India</p>
        </div>

        <div class="search">
            <input type="text" placeholder="Search for products">
        </div>

        <div class="login">
            Login
        </div>

        <div class="cart">
            My Cart
        </div>

    </nav>

    <section class="main-banner">
        <img src="assets/Frame-1437256605-2-2.jpg" alt="Daily Essentials">
    </section>

    <section class="small-banners">

        <div class="small-banner">
            <img src="assets/pharmacy-WEB.jpg" alt="Pharmacy">
        </div>

        <div class="small-banner">
            <img src="assets/pet_crystal_WEB-1.png" alt="Pet Care">
        </div>

        <div class="small-banner">
            <img src="assets/baby_crystal_WEB-1.png" alt="Baby Care">
        </div>

    </section>

    <section class="categories">

        <div class="category">
            <img src="assets/paan-corner_web.jpg" alt="Paan Corner">
        </div>

        <div class="category">
            <img src="assets/Slice-2_10.png" alt="Dairy Bread Eggs">
        </div>

        <div class="category">
            <img src="assets/Slice-3_9.png" alt="Fruits Vegetables">
        </div>

        <div class="category">
            <img src="assets/Slice-4_9.png" alt="Cold Drinks Juices">
        </div>

        <div class="category">
            <img src="assets/Slice-5_4.png" alt="Snacks Munchies">
        </div>

        <div class="category">
            <img src="assets/Slice-6_5.png" alt="Breakfast Instant Food">
        </div>

        <div class="category">
            <img src="assets/Slice-7_3.png" alt="Sweet Tooth">
        </div>

        <div class="category">
            <img src="assets/Slice-7-1_0.png" alt="Tea Coffee Milk Drinks">
        </div>

        <div class="category">
            <img src="assets/Slice-8_4.png" alt="Bakery Biscuits">
        </div>

    </section>

</body>
</html>
